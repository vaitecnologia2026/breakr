services:
  postgres:
    image: postgres:16-alpine
    container_name: breakr_pg
    environment:
      POSTGRES_USER: breakr
      POSTGRES_PASSWORD: breakr
      POSTGRES_DB: breakr_os
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breakr -d breakr_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: breakr_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
