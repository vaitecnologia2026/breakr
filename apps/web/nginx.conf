# SPA do Breakr OS — fallback de rotas para index.html (React Router).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Assets com hash podem ter cache longo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Qualquer rota → index.html (client-side routing).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
