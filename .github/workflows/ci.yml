name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run db:generate

      - name: Build shared (enums/tipos em JS — exigido pelo runtime compilado da API)
        run: npm run build --workspace @breakr/shared

      - name: Build API (NestJS)
        run: npm run build --workspace @breakr/api

      - name: Build Web (React/Vite)
        run: npm run build --workspace @breakr/web
